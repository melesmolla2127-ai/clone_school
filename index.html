<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f8fafc" />
    <script>
      (() => {
        let theme = 'light'
        try {
          const stored = JSON.parse(localStorage.getItem('clone-school.settings.v1') || 'null')
          if (stored && ['light', 'dark', 'system'].includes(stored.theme)) theme = stored.theme
        } catch {}
        if (theme === 'system') {
          theme = window.matchMedia?.('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.dataset.theme = theme
        document.querySelector('meta[name="theme-color"]')?.setAttribute('content', theme === 'dark' ? '#071426' : '#f8fafc')
      })()
    </script>
    <meta name="description" content="Clone School — a premium mobile learning experience." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Clone School" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Clone School</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
